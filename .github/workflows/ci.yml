name: CI

# The gate before merge (C7). Every job here blocks the merge — a check that
# does not block is a check nobody reads.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API's types come from the generated Prisma client. Until
      # `prisma generate` has run, @prisma/client is only a shim whose types
      # re-export from '.prisma/client', a path that does not exist yet — so
      # typecheck cannot be the first step that touches it.
      #
      # It works on a developer machine because the client was generated there
      # at some point and persists in the store. It has never worked here,
      # which is why every run of this workflow has failed at Typecheck.
      #
      # The api build script generates the client too, but Build runs last and
      # is never reached.
      - name: Generate Prisma client
        run: pnpm --filter @portfolio-cms/api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      # The script carries --max-warnings 0: warnings fail the build, here and
      # locally, so they cannot accumulate until nobody reads them.
      - name: Lint
        run: pnpm lint

      # Verified, not applied — a formatting change stays someone's deliberate commit (D8.2).
      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
