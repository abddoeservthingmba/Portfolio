# Render configuration for the API (Phase 7).
#
# Deployed independently of the site, so the two can be released and rolled
# back separately (C1). Every secret is marked sync:false — Render prompts for
# it once and stores it, and no value ever enters this file or the repository.

services:
  - type: web
    name: portfolio-cms-api
    runtime: node
    plan: free
    region: singapore
    branch: main

    # The Prisma client is generated during build, not committed, so it always
    # matches the schema in the deployed commit.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @portfolio-cms/api exec prisma generate &&
      pnpm --filter @portfolio-cms/api build

    # Migrations run before the server accepts traffic, so the schema is never
    # behind the code that expects it. `migrate deploy` applies committed
    # migrations only — it never generates one, and never prompts.
    startCommand: >-
      pnpm --filter @portfolio-cms/api exec prisma migrate deploy &&
      pnpm --filter @portfolio-cms/api start

    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      # Render supplies the port; the app reads it rather than assuming one.
      - key: PORT
        value: 10000

      # Locked to the exact production origin. No wildcard, ever (D5).
      - key: ALLOWED_ORIGINS
        sync: false

      - key: PUBLIC_SITE_URL
        sync: false

      - key: RATE_LIMIT_WINDOW
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 20
      - key: MAX_UPLOAD_BYTES
        value: 5242880

      # --- Secrets. Entered in the Render dashboard, never here. ---
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
