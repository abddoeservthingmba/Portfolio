# Render configuration for the API (Phase 7).
#
# Deployed independently of the site, so the two can be released and rolled
# back separately (C1). Every secret is marked sync:false — Render prompts for
# it once and stores it, and no value ever enters this file or the repository.
#
# IMPORTANT: this file is only read when the service is created through
# **Blueprints**. A service created with "New → Web Service" ignores it
# entirely and auto-detects an npm build, which fails on a pnpm workspace.

services:
  - type: web
    name: portfolio-cms-api
    runtime: node
    plan: free
    region: singapore
    branch: main

    # pnpm is installed with npm rather than corepack. Corepack has to reach
    # the registry to resolve the packageManager field, and its failures are
    # opaque; npm is already present and needs no such round trip.
    #
    # The api build script runs prisma generate itself, so the client always
    # matches the schema in the deployed commit and no build path can skip it.
    buildCommand: >-
      npm install -g pnpm@10.34.5 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @portfolio-cms/api build

    # Migrations run before the server accepts traffic, so the schema is never
    # behind the code that expects it. `migrate deploy` applies committed
    # migrations only — it never generates one, and never prompts.
    # Depends on npm and node only. pnpm may not be on PATH at runtime, and
    # yarn refuses to run at all while packageManager names pnpm.
    startCommand: >-
      cd apps/api &&
      npx --no-install prisma migrate deploy &&
      node dist/index.js

    healthCheckPath: /api/v1/health

    # Node version comes from .node-version, which applies to manually created
    # services too.
    envVars:
      # Pinned. The build and runtime both assume Node 20+, and leaving this to
      # the platform default means a silent change breaks a deploy one day.
      - key: NODE_ENV
        value: production

      # Render supplies the port; the app reads it rather than assuming one.
      - key: PORT
        value: 10000

      # Locked to the exact production origin. No wildcard, ever (D5).
      - key: ALLOWED_ORIGINS
        sync: false

      # The public site's origin, for absolute sitemap URLs. Not this service.
      - key: PUBLIC_SITE_URL
        sync: false

      - key: RATE_LIMIT_WINDOW
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 20
      - key: MAX_UPLOAD_BYTES
        value: 5242880

      # --- Secrets. Entered in the Render dashboard, never here. ---
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
