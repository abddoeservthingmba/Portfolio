<!doctype html>
<html lang="en" data-theme="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Archivo Black for display, Inter for everything else.

      Preconnect to both hosts: the stylesheet comes from googleapis.com but the
      font files come from gstatic.com, and without the second hint that
      connection is not opened until the CSS has already parsed.

      display=swap, so a slow font never blocks text. The headline reveal in
      SplitText measures nothing, so a late swap reflows type without breaking
      the animation.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400..700&display=swap"
    />

    <title>Portfolio</title>
    <meta
      name="description"
      content="Portfolio — projects, experience, skills and certifications."
    />
    <script>
      // Applies the stored theme before first paint so the page never flashes
      // the wrong palette. Kept inline and tiny for that reason.
      document.documentElement.classList.add('js');
      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
        // The palette is a second axis, and needs the same pre-paint treatment:
        // applied from React it would land after the first frame and every load
        // would flash Ember before settling. Ember itself is the absence of the
        // attribute, so it is not listed here.
        var palette = localStorage.getItem('palette');
        if (palette === 'tide' || palette === 'moss' || palette === 'plum') {
          document.documentElement.setAttribute('data-palette', palette);
        }
      } catch (_) {
        /* private mode or blocked storage — fall back to the system palette */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
